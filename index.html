    <title>Данил — Fullstack Developer</title>

    <!-- котик грузится из JS (HeroVisual) — без preload запрос уходит только после бандла.
         Без fetchpriority="high": на медленном канале он отбирал скорость у JS, без которого страница пустая -->
    <link rel="preload" as="image" href="hero-cat.jpg">
    <!-- шрифты первого экрана качаются сразу, параллельно с JS: страница ждёт их перед показом
         (src/fonts.js), а без preload браузер узнаёт о них только из CSS. Vite подставит те же
         хешированные файлы, что и в CSS, поэтому второй раз они не скачаются -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/onest/files/onest-cyrillic-800-normal.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/onest/files/onest-cyrillic-700-normal.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./node_modules/@fontsource/inter/files/inter-cyrillic-400-normal.woff2">
    <!-- фон и отступы сразу, до загрузки JS/CSS — иначе пока грузится бандл, видна белая страница
         с отступом 8px. Значения те же, что в src/index.css -->
    <style>body{margin:0;background:#faf9f6}</style>
